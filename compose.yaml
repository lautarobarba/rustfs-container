name: rustfs
services:
  # La imagen corre como usuario no root (UID/GID 10001), por lo que
  # el directorio montado debe pertenecer a ese usuario
  rustfs-perms:
    container_name: rustfs-perms
    image: alpine:latest
    user: root
    command: chown -R 10001:10001 /data
    volumes:
      - ./data:/data

  rustfs:
    container_name: rustfs
    image: rustfs/rustfs:latest
    restart: always
    env_file: .env
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      # server
      - ${RUSTFS_SERVER_PORT}:9000
      # web ui
      - ${RUSTFS_WEB_PORT}:9001
    volumes:
      - ./data:/data
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/health"]
      start_period: 30s
      interval: 30s
      retries: 3
      timeout: 10s

  # Cliente S3 (aws-cli) usado por los scripts de backup y para restaurar.
  # No se inicia con "docker compose up", se usa con "docker compose run --rm backup ..."
  backup:
    image: amazon/aws-cli:latest
    profiles:
      - backup
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://rustfs:9000
    volumes:
      - ./backups:/backups
      - ./restore:/restore
